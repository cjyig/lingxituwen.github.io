<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>灵析图文｜一站式AI图文工具箱</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans‑serif}
        body{background:linear-gradient(180deg,#f0f4fc,#fff);padding:40px 24px;max-width:640px;margin:0 auto}
        .top-badge{background:#e8f0fe;color:#2b5cb8;font-size:13px;padding:6px 14px;border-radius:30px;margin:0 auto 24px;width:fit-content}
        .header{text-align:center;margin-bottom:48px}
        .header h1{font-size:28px;color:#111827;margin-bottom:14px}
        .header p{color:#64748b;font-size:16px;line-height:1.6}
        .grid-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:60px}
        .func-card{background:#fff;padding:28px 20px;border-radius:20px;box-shadow:0 4px 20px rgba(37,99,235,.08)}
        .func-card:active{transform:translateY(-4px);box-shadow:0 8px 24px rgba(37,99,235,.13)}
        .func-card h3{font-size:18px;color:#1e293b;margin-bottom:8px}
        .func-card p{font-size:14px;color:#718096;line-height:1.5}
        .action-btn{width:100%;padding:20px;border:none;border-radius:50px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(90deg,#2563eb,#4080ff);box-shadow:0 6px 18px rgba(37,99,235,.35)}
        .action-btn:active{transform:scale(0.97)}
        .desc-block{margin:40px 0;background:#fff;border-radius:18px;padding:24px;box-shadow:0 3px 16px #00000009}
        .desc-block h4{margin-bottom:12px;color:#222}
        .desc-block li{margin-left:16px;color:#666;font-size:14px;line-height:1.8;list-style:disc}
        .footer-tip{margin-top:50px;text-align:center;font-size:12px;color:#a0aec0}
    </style>
</head>
<body>
    <span class="top-badge">小程序 · 无需下载安装</span>
    <div class="header">
        <h1>灵析图文工具</h1>
        <p>老照片修复 · AI会议纪要 · 小说人物图谱 · 图片处理</p>
    </div>
    <div class="grid-wrap">
        <div class="func-card">
            <h3>老照片高清修复</h3>
            <p>去除划痕、褪色老旧照片翻新</p>
        </div>
        <div class="func-card">
            <h3>AI会议纪要整理</h3>
            <p>录音文字快速生成结构化纪要</p>
        </div>
        <div class="func-card">
            <h3>九宫格切图</h3>
            <p>图片切分为九宫格</p>
        </div>
        <div class="func-card">
            <h3>多功能图片工具</h3>
            <p>压缩、水印处理</p>
        </div>
    </div>
    <button class="action-btn" onclick="openMini()">立即进入小程序</button>
    <div class="desc-block">
        <h4>工具优势</h4>
        <ul>
            <li>上传素材仅临时运算，注重隐私防护</li>
            <li>多款便民图文工具持续更新</li>
        </ul>
    </div>
    <div class="footer-tip">©灵析图文 ｜ 轻量化AI工具箱</div>
<script>
function openMini(){
    if(navigator.userAgent.includes("MicroMessenger")){
        //此处替换你的小程序跳转路径
        location.href="weixin://wxpay/bizpayurl?xxxx";
    }else{
        alert("打开访问小程序");
    }
}
</script>
</body>
</html>
